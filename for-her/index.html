<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FBEAE6" />

    <!--
      %HER_NAME% and %SITE_URL% are filled in from src/for-her/content/config.ts at build time
      (see forHerMeta in vite.config.js). Kept vague on purpose so the preview spoils nothing.
    -->
    <title>For you, %HER_NAME% 💌</title>
    <meta name="description" content="Something I made just for you. Open with sound on 🔊" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="For you, %HER_NAME% 💌" />
    <meta property="og:description" content="Something I made just for you. Open with sound on 🔊" />
    <meta property="og:url" content="%SITE_URL%/for-her/" />
    <meta property="og:image" content="%SITE_URL%/for-her/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sealed envelope" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="For you, %HER_NAME% 💌" />
    <meta name="twitter:description" content="Something I made just for you. Open with sound on 🔊" />
    <meta name="twitter:image" content="%SITE_URL%/for-her/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/for-her/favicon.svg" />
    <link rel="apple-touch-icon" href="/for-her/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/for-her/main.tsx"></script>
  </body>
</html>
